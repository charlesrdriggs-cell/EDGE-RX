name: Daily pickup reminders

on:
  schedule:
    # Every day 23:00 UTC = 6 PM Eastern (7 PM during daylight saving)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Email customers whose pickup is tomorrow
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add SITE_URL and CRON_SECRET repository secrets first (see DEPLOY.md)."; exit 1
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/daily"
