name: Weekly reminders

on:
  schedule:
    # Thursdays 14:00 UTC = 9 AM Eastern (10 AM during daylight saving)
    - cron: "0 14 * * 4"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder emails
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add SITE_URL and CRON_SECRET repository secrets first (see DEPLOY.md)."; exit 1
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
